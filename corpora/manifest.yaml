# Source texts. Nothing listed here is committed (constitution IV).
#
# Each source has an id, its edition, a citation, its licence, the pinned raw
# download(s), the preparation step (a function in src/bomstylo/prepare.py)
# and its prepared paths under corpora/prepared/, with the digest of
# corpora/checksums/<id>.sha256.
#
#   uv run bomstylo fetch     download, check, prepare, verify (all or some ids)
#   uv run bomstylo verify    check what is on disk
#
# Raw entries: either one file (`url` or `urls`, tried in order; `save_as`;
# `sha256` of the download), or many unchanged files (`url_template` filled
# with each name in `files`; checked through the prepared checksums).
# `notes` records anything a maintainer needs before re-pinning.
#
# The report's sources section is generated from this file. Which analyses
# read each source is in ANALYSES.md (generated from the analyses' own
# declarations).

