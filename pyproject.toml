[project]
name = "bomstylo"
version = "0.1.0"
description = "Reproducible stylometric measurements of claims about the Book of Mormon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.18.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Verb counts for the per-verb and Greek analyses. Pinned: verb counts (and so
# per-verb rates) depend on the exact parser model.
verbs = [
    "spacy==3.8.16",
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.scripts]
bomstylo = "bomstylo.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bomstylo", "analyses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
